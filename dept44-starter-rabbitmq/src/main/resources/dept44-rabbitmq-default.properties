# dept44-starter-rabbitmq defaults. Loaded with the lowest precedence (after the application's own configuration) by
# RabbitMqDefaultPropertiesEnvironmentPostProcessor, so a service overrides any of them in its application.yml.
# The broker confirms every message, and returns one it cannot route instead of dropping it. Dept44RabbitPublisher
# depends on all three.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# A broker that cannot be reached fails a publish in seconds, not after the client's 60 s
spring.rabbitmq.connection-timeout=5s
# The topology is declared through rabbitmq-topology, and the service's AMQP user has no configure permission
spring.rabbitmq.dynamic=false
# Trace context follows the message once tracing is on
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
spring.rabbitmq.listener.direct.observation-enabled=true
# A listener retries a transient failure, such as a database that does not answer, with a growing delay: 1 s, 2 s,
# 4 s and so on up to every 30 s, about 8 minutes in all, plus the time each attempt takes, and 15 minutes at most (set
# in RabbitMqConfiguration). Then an outage goes back in the queue, where it counts against the queue's delivery limit,
# and a server error is dead-lettered. Any other failure is dead-lettered at once. See TransientFailures.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30s
spring.rabbitmq.listener.simple.retry.max-retries=20
spring.rabbitmq.listener.direct.retry.enabled=true
spring.rabbitmq.listener.direct.retry.initial-interval=1s
spring.rabbitmq.listener.direct.retry.multiplier=2
spring.rabbitmq.listener.direct.retry.max-interval=30s
spring.rabbitmq.listener.direct.retry.max-retries=20
# A listener holds one message at a time. One it has prefetched waits unacknowledged while the listener retries
# another, and the broker's consumer_timeout (30 min) counts from the delivery: prefetch times the time a message can
# take must stay below it. Spring AMQP's default is 250.
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.direct.prefetch=1
